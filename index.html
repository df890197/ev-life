<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ev Life - 🐾 LUXGEN n⁷ APP</title>
    
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ev Life">
    
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="manifest" href="./manifest.json">

    <!-- Google Fonts: 保留 Fredoka, Noto Sans TC, 以及 Roboto Mono 作為非蘋陣營的斜線0備用 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <style>
        /* 第一時間鎖定底色，防閃白，並設定 iOS 彈性滾動邊緣顏色 */
        :root, html, body { background-color: #f6f7f9; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
        @media (prefers-color-scheme: dark) { :root, html, body { background-color: #0f172a; } }
        html.dark, html.dark body { background-color: #0f172a !important; }
        html:not(.dark), html:not(.dark) body { background-color: #f6f7f9 !important; }

        #appSplashScreen { background-color: #f6f7f9 !important; }
        @media (prefers-color-scheme: dark) { #appSplashScreen { background-color: #0f172a !important; } }
        html.dark #appSplashScreen { background-color: #0f172a !important; }
        html:not(.dark) #appSplashScreen { background-color: #f6f7f9 !important; }

        body { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; touch-action: manipulation; }

        /* 隱藏預設日曆 icon 與滾動條 */
        input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0 !important; cursor: pointer; position: absolute; right: 0; top: 0; width: 100%; height: 100%; z-index: 30; }
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 參考圖片風格：柔和奶油色數據卡片 */
        .app-stat-card {
            background: linear-gradient(145deg, #fffaf0 0%, #fff6e5 100%);
            border: 1px solid rgba(251, 191, 36, 0.15);
            box-shadow: 0 4px 20px -5px rgba(251, 191, 36, 0.1);
        }
        .dark .app-stat-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.5);
        }

        /* 底部毛玻璃導航列 */
        .glass-tab-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        .dark .glass-tab-bar {
            background: rgba(15, 23, 42, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 分頁切換動畫 */
        .view-section { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .view-section.active { display: block; opacity: 1; animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 底部導航選中狀態 */
        .tab-btn.active { color: #1e293b; font-weight: 900; }
        .dark .tab-btn.active { color: #f8fafc; }
        
        .ios-safe-nav { padding-top: env(safe-area-inset-top, 0px) !important; }
        input[type="date"] { position: relative; -webkit-appearance: none; appearance: none; display: block; min-height: 2.75rem; line-height: normal; }
        input[type="date"]::-webkit-date-and-time-value { height: auto; min-height: 1.5em; text-align: left; margin: 0; padding: 0; width: 100%; }
        .dark input, .dark select { color-scheme: dark; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fredoka', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
                        // 🚀 優先使用蘋果 SF Mono，非蘋裝置降級為 Roboto Mono，完美支援斜線0
                        mono: ['"SF Mono"', 'SFMono-Regular', '"Roboto Mono"', 'ui-monospace', '"Noto Sans TC"', 'monospace'],
                    },
                    colors: {
                        cuteMint: { 50: '#f0fdf4', 100: '#ccfbf1', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' },
                    }
                }
            }
        };

        // Splash 畫面控制
        function onSplashImageLoad() {
            const img = document.getElementById('splashLogoImg');
            if (img) { img.classList.remove('opacity-0'); img.classList.add('opacity-100'); }
        }
        function onSplashImageError() {
            const img = document.getElementById('splashLogoImg');
            if (img) img.remove();
            const fallback = document.getElementById('splashFallbackContainer');
            if (fallback) fallback.classList.add('show-fallback');
        }
    </script>
</head>
<body class="font-sans text-slate-800 dark:text-slate-100 min-h-screen relative slashed-zero select-none">

    <div id="appSplashScreen" class="fixed inset-0 z-[9998] flex flex-col items-center justify-center transition-opacity duration-400">
        <div id="splashFallbackContainer" class="absolute inset-0 flex flex-col items-center justify-center space-y-4 z-10">
            <span class="text-7xl">🐾</span>
            <h2 class="text-xl font-black tracking-wider mt-2">Ev Life APP...</h2>
        </div>
        <img id="splashLogoImg" src="./splash.png" alt="Splash" class="w-full h-full object-cover opacity-0 absolute inset-0 z-20 transition-opacity duration-300" onload="onSplashImageLoad()" onerror="onSplashImageError()">
    </div>

    <!-- 頂部膠囊導航列 (Top Pill Bar) -->
    <header class="sticky top-0 z-40 bg-[#f6f7f9]/90 dark:bg-[#0f172a]/90 backdrop-blur-xl ios-safe-nav border-b border-transparent transition-all">
        <div class="flex items-center justify-between px-4 py-3 max-w-4xl mx-auto">
            <!-- 總覽按鈕 -->
            <button onclick="switchTab('home')" class="flex items-center gap-2 bg-white dark:bg-slate-800 px-4 py-2 rounded-full shadow-[0_2px_10px_rgba(0,0,0,0.03)] dark:shadow-none border border-slate-100 dark:border-slate-700 text-[11px] font-black tracking-wider transition active:scale-95">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg>
                總覽
            </button>

            <!-- 車輛選擇膠囊 -->
            <div class="flex items-center gap-2 bg-slate-900 dark:bg-slate-800 px-1.5 py-1.5 pr-5 rounded-full shadow-md cursor-pointer transition active:scale-95" onclick="toggleSyncModal()">
                <div class="bg-amber-500 text-slate-900 px-2.5 py-1 rounded-full text-[10px] font-black">純電</div>
                <span id="topEvName" class="text-white text-xs font-bold font-mono tracking-wide">LUXGEN n7</span>
            </div>

            <!-- 主題切換按鈕 -->
            <button onclick="toggleTheme()" class="w-9 h-9 bg-white dark:bg-slate-800 rounded-full flex items-center justify-center shadow-[0_2px_10px_rgba(0,0,0,0.03)] dark:shadow-none border border-slate-100 dark:border-slate-700 transition active:scale-95">
                <svg id="themeSunIcon" class="w-4 h-4 text-amber-500 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.46 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path></svg>
                <svg id="themeMoonIcon" class="w-4 h-4 text-indigo-400 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            </button>
        </div>
    </header>

    <!-- 主內容區 (Main Content) - 使用 Tabs 切換 -->
    <main class="max-w-4xl mx-auto pb-28 pt-2">
        
        <!-- 🔹 Tab 1: 首頁 (Home) -->
        <div id="view-home" class="view-section active px-4">
            <!-- 英雄區 (Hero Image) -->
            <div class="relative w-full h-56 sm:h-72 rounded-[2rem] overflow-hidden mb-6 shadow-sm border border-slate-200/50 dark:border-slate-800">
                <div class="absolute inset-0 bg-gradient-to-br from-slate-200 to-slate-400 dark:from-slate-700 dark:to-slate-900 flex items-center justify-center">
                    <img src="logo.png" alt="EV" class="w-3/4 h-3/4 object-contain opacity-80 mix-blend-multiply dark:mix-blend-screen drop-shadow-2xl scale-110" onerror="this.src='https://placehold.co/400x200/1e293b/2dd4bf?text=EV+Life'">
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>
                <div class="absolute bottom-4 left-6">
                    <h1 id="heroEvName" class="text-white text-2xl sm:text-3xl font-black tracking-widest drop-shadow-md">LUXGEN n7</h1>
                </div>
            </div>

            <!-- 數據網格 (Stats Grid - 參考圖片風格) -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- 1. 當前里程 -->
                <div class="app-stat-card p-5 rounded-[1.5rem] flex flex-col items-center justify-center text-center">
                    <div class="w-8 h-8 bg-amber-100 dark:bg-amber-900/50 text-amber-600 dark:text-amber-400 rounded-full flex items-center justify-center mb-2.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span id="statTotalKm" class="text-xl sm:text-2xl font-black text-slate-800 dark:text-white font-mono tracking-tight">0</span>
                        <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">km</span>
                    </div>
                    <div class="text-[11px] font-bold text-slate-400 mt-1">總里程</div>
                </div>

                <!-- 2. 平均電耗 -->
                <div class="app-stat-card p-5 rounded-[1.5rem] flex flex-col items-center justify-center text-center">
                    <div class="w-8 h-8 bg-teal-100 dark:bg-teal-900/50 text-teal-600 dark:text-teal-400 rounded-full flex items-center justify-center mb-2.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span id="statAvgEfficiency" class="text-xl sm:text-2xl font-black text-slate-800 dark:text-white font-mono tracking-tight">0.00</span>
                        <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">km/度</span>
                    </div>
                    <div class="text-[11px] font-bold text-slate-400 mt-1">平均電耗</div>
                </div>

                <!-- 3. 能源總成本 -->
                <div class="app-stat-card p-5 rounded-[1.5rem] flex flex-col items-center justify-center text-center">
                    <div class="w-8 h-8 bg-sky-100 dark:bg-sky-900/50 text-sky-600 dark:text-sky-400 rounded-full flex items-center justify-center mb-2.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"></path></svg>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">$</span>
                        <span id="statTotalCost" class="text-xl sm:text-2xl font-black text-slate-800 dark:text-white font-mono tracking-tight">0</span>
                    </div>
                    <div class="text-[11px] font-bold text-slate-400 mt-1">能源總成本</div>
                </div>

                <!-- 4. 每公里電費 -->
                <div class="app-stat-card p-5 rounded-[1.5rem] flex flex-col items-center justify-center text-center">
                    <div class="w-8 h-8 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded-full flex items-center justify-center mb-2.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">$</span>
                        <span id="statCostPerKm" class="text-xl sm:text-2xl font-black text-slate-800 dark:text-white font-mono tracking-tight">0.00</span>
                    </div>
                    <div class="text-[11px] font-bold text-slate-400 mt-1">每公里電費</div>
                </div>
            </div>
        </div>

        <!-- 🔹 Tab 2: 新增/編輯紀錄 (Add/Edit) -->
        <div id="view-add" class="view-section px-4">
            <div class="bg-white dark:bg-[#1e293b] p-6 rounded-[2rem] shadow-sm border border-slate-100 dark:border-slate-800">
                <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-100 dark:border-slate-700">
                    <h2 class="text-base font-black flex items-center gap-2">
                        <span class="bg-slate-900 dark:bg-white text-white dark:text-slate-900 w-6 h-6 rounded-full flex items-center justify-center text-xs">✍️</span>
                        <span id="formTitle">記錄本次旅程</span>
                    </h2>
                </div>

                <form id="recordForm" onsubmit="addRecord(event)" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 block">日期</label>
                            <input type="date" id="inputDate" required class="w-full px-4 py-3 bg-slate-50 dark:bg-[#0f172a] border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-bold focus:outline-none focus:border-amber-400 transition-colors">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 block">補給類型</label>
                            <select id="inputChargeType" class="w-full px-4 py-3 bg-slate-50 dark:bg-[#0f172a] border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-bold focus:outline-none focus:border-amber-400 transition-colors appearance-none">
                                <option value="DC-快充" selected>⚡ 快充 (DC)</option>
                                <option value="AC-慢充">🔌 慢充 (AC)</option>
                                <option value="未充電">🐾 純行駛 (無充電)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="sm:col-span-1">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 block">行駛里程 (km)</label>
                            <input type="number" step="0.1" id="inputDistance" required placeholder="120" inputmode="decimal" class="w-full px-4 py-3 bg-slate-50 dark:bg-[#0f172a] border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-mono font-bold focus:outline-none focus:border-amber-400 transition-colors">
                        </div>
                        <div>
                            <label id="startSocLabel" class="text-[11px] sm:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 block">出發前 SOC (%)</label>
                            <input type="number" step="1" min="0" max="100" id="inputStartSoc" required placeholder="20" inputmode="numeric" oninput="updateConvertedPowerHint()" class="w-full px-4 py-3 bg-slate-50 dark:bg-[#0f172a] border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-mono font-bold focus:outline-none focus:border-amber-400 transition-colors">
                        </div>
                        <div>
                            <label id="endSocLabel" class="text-[11px] sm:text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 block">抵達後 SOC (%)</label>
                            <input type="number" step="1" min="0" max="100" id="inputEndSoc" required placeholder="80" inputmode="numeric" oninput="updateConvertedPowerHint()" class="w-full px-4 py-3 bg-slate-50 dark:bg-[#0f172a] border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-mono font-bold focus:outline-none focus:border-amber-400 transition-colors">
                        </div>
                    </div>

                    <div class="text-right">
                        <span id="powerHintText" class="text-[10px] text-amber-600 dark:text-amber-400 font-bold bg-amber-50 dark:bg-amber-900/30 px-3 py-1.5 rounded-full inline-block border border-amber-200 dark:border-amber-700/50">共消耗 0% 電量 (約 0.00 度)</span>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 block">本次花費 (元) - 無則填 0</label>
                        <input type="number" step="1" id="inputCost" required placeholder="0" inputmode="numeric" class="w-full px-4 py-3 bg-slate-50 dark:bg-[#0f172a] border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-mono font-bold focus:outline-none focus:border-amber-400 transition-colors">
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5 block">備註 (選填)</label>
                        <input type="text" id="inputNote" placeholder="例如：帶貓咪去兜風 🐱" class="w-full px-4 py-3 bg-slate-50 dark:bg-[#0f172a] border border-slate-200 dark:border-slate-700 rounded-2xl text-sm font-bold focus:outline-none focus:border-amber-400 transition-colors">
                    </div>

                    <div class="flex gap-3 pt-4">
                        <button type="submit" class="flex-1 bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-900 text-sm font-black py-4 rounded-2xl shadow-md transition active:scale-95">
                            <span id="submitBtnText">儲存紀錄</span>
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-white text-sm font-bold py-4 px-6 rounded-2xl transition active:scale-95">
                            取消
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 🔹 Tab 3: 紀錄列表 (Records) -->
        <div id="view-records" class="view-section px-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-black">歷史紀錄</h2>
                <div class="flex gap-2">
                    <button onclick="exportCSV()" class="text-[10px] text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 px-3 py-1.5 rounded-full font-bold shadow-sm border border-slate-200 dark:border-slate-700 transition active:scale-95">匯出 CSV</button>
                    <button onclick="clearAllData()" class="text-[10px] text-rose-500 bg-rose-50 dark:bg-rose-900/30 px-3 py-1.5 rounded-full font-bold transition active:scale-95">清空</button>
                </div>
            </div>
            
            <div id="noDataPlaceholder" class="hidden text-center py-16 text-slate-400">
                <div class="text-4xl mb-2">📭</div>
                <p class="text-xs font-bold">空空如也，快去新增第一筆紀錄吧！</p>
            </div>

            <!-- 手機版卡片列表 -->
            <div id="recordMobileList" class="space-y-4 pb-4">
                <!-- Javascript 動態渲染 -->
            </div>
        </div>

        <!-- 🔹 Tab 4: 分析圖表 (Analysis) -->
        <div id="view-analysis" class="view-section px-4">
            <div class="bg-white dark:bg-[#1e293b] p-5 sm:p-6 rounded-[2rem] shadow-sm border border-slate-100 dark:border-slate-800">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
                    <h2 class="text-base font-black flex items-center gap-2">
                        <span class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 w-7 h-7 rounded-full flex items-center justify-center text-xs">📊</span>
                        趨勢分析
                    </h2>
                    
                    <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl self-start">
                        <button onclick="setChartFilter('all')" id="btnChartAll" class="px-3 py-1.5 text-[10px] rounded-lg bg-white dark:bg-slate-600 shadow text-slate-900 dark:text-white font-bold transition-all">全部</button>

    <div id="confirmModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] flex items-center justify-center hidden opacity-0 transition-opacity duration-300">

            <h3 id="confirmModalTitle" class="text-base font-black mb-2">確認動作</h3>

    <script>
        // ==========================================
        // 核心狀態變數
        // ==========================================
        let records = [];
        let efficiencyChartInstance = null;
        let syncUrl = "";
        let evName = "LUXGEN n7";
        let batteryCapacity = 57.7;
        let initialOdometer = 0;
        let activeConfirmCallback = null;
        let editingRecordId = null;
        let currentChartFilter = 'all';
        let currentMonthFilter = 'all';
        let deferredPrompt = null;

        // ==========================================
        // APP UI 切換邏輯 (Tab Switching)
        // ==========================================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('tab-' + tabId);
            if (activeBtn && tabId !== 'add') activeBtn.classList.add('active');

            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');

            window.scrollTo({ top: 0, behavior: 'smooth' });

            if(tabId === 'analysis' && typeof Chart !== 'undefined') updateCharts();
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('toastIcon').textContent = isError ? "⚠️" : "🐾";
            
            toast.className = `fixed top-[env(safe-area-inset-top,20px)] left-1/2 -translate-x-1/2 z-[120] transform translate-y-0 opacity-100 visible pointer-events-auto transition-all duration-300 bg-slate-900/95 dark:bg-amber-500 text-white dark:text-slate-900 px-5 py-3 rounded-full shadow-lg flex items-center space-x-2 text-xs font-bold whitespace-nowrap mt-16`;
            
            setTimeout(() => {
                toast.className = `fixed top-[env(safe-area-inset-top,20px)] left-1/2 -translate-x-1/2 z-[120] transform -translate-y-10 opacity-0 invisible pointer-events-none transition-all duration-300 bg-slate-900/95 dark:bg-amber-500 text-white dark:text-slate-900 px-5 py-3 rounded-full shadow-lg flex items-center space-x-2 text-xs font-bold whitespace-nowrap mt-16`;
            }, 2500);
        }

        // ==========================================
        // 初始化與設定
        // ==========================================
        function setupThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('themeSunIcon').style.display = isDark ? 'block' : 'none';
            document.getElementById('themeMoonIcon').style.display = isDark ? 'none' : 'block';
        }

        function toggleTheme() {
            const htmlEl = document.documentElement;
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark'); localStorage.setItem('ev_life_theme', 'light');
            } else {
                htmlEl.classList.add('dark'); localStorage.setItem('ev_life_theme', 'dark');
            }
            setupThemeIcons();
            if (typeof Chart !== 'undefined') updateCharts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initAppCore();
            const splash = document.getElementById('appSplashScreen');
            if (splash) setTimeout(() => { splash.classList.add('opacity-0'); setTimeout(() => splash.remove(), 400); }, 100);
        });

        function initAppCore() {
            setupThemeIcons();
            
            syncUrl = localStorage.getItem('ev_life_sync_url') || "";
            if (document.getElementById('syncUrlInput')) document.getElementById('syncUrlInput').value = syncUrl;
            
            evName = localStorage.getItem('ev_life_ev_name') || "LUXGEN n7";
            document.getElementById('topEvName').textContent = evName;
            document.getElementById('heroEvName').textContent = evName;
            if (document.getElementById('evNameInput')) document.getElementById('evNameInput').value = evName;

            batteryCapacity = parseFloat(localStorage.getItem('ev_life_battery_capacity')) || 57.7;
            if (document.getElementById('batteryCapacityInput')) document.getElementById('batteryCapacityInput').value = batteryCapacity;

            initialOdometer = parseFloat(localStorage.getItem('ev_life_initial_odometer')) || 0;
            if (document.getElementById('initialOdometerInput')) document.getElementById('initialOdometerInput').value = initialOdometer;
            
            const today = new Date();
            if(document.getElementById('inputDate')) document.getElementById('inputDate').value = today.toISOString().split('T')[0];

            document.getElementById('inputChargeType').addEventListener('change', handleChargeTypeChange);
            handleChargeTypeChange(); 

            setupNumericRestrictions();
            updateSyncUiStatus();
            updatePwaDiagnostic();

            const localData = localStorage.getItem('ev_life_records');
            if (localData) { records = JSON.parse(localData).map(rec => parseRecordSoc(rec)); }
            else { localStorage.setItem('ev_life_records', JSON.stringify(records)); }

            let lastUpdated = parseInt(localStorage.getItem('ev_life_last_updated')) || 0;
            if (records.length > 0 && lastUpdated === 0) localStorage.setItem('ev_life_last_updated', Date.now());

            renderDashboard();
            autoFillStartSoc(); 
            
            if ('requestIdleCallback' in window) requestIdleCallback(() => { if (typeof Chart !== 'undefined') updateCharts(); if (syncUrl) syncWithCloud('auto', true); });
            else setTimeout(() => { if (typeof Chart !== 'undefined') updateCharts(); if (syncUrl) syncWithCloud('auto', true); }, 500);

            setupDelegatedEvents();
        }

        // ==========================================
        // 資料處理核心邏輯
        // ==========================================
        function saveLocalState(newRecords) {
            records = newRecords;
            const timestamp = Date.now();
            localStorage.setItem('ev_life_records', JSON.stringify(records));
            localStorage.setItem('ev_life_last_updated', timestamp);
            return timestamp;
        }

        function handleChargeTypeChange() {
            const type = document.getElementById('inputChargeType').value;
            const costInput = document.getElementById('inputCost');
            if (type === "未充電") {
                costInput.value = "0"; costInput.disabled = true; costInput.classList.add('opacity-40');
                document.getElementById('startSocLabel').textContent = "出發前 SOC (%)";
                document.getElementById('endSocLabel').textContent = "抵達後 SOC (%)";
                // 只有「純行駛」才自動帶入上一次的 endSoc
                if (editingRecordId === null) autoFillStartSoc();
            } else {
                if (editingRecordId === null && costInput.value === "0") costInput.value = "";
                costInput.disabled = false; costInput.classList.remove('opacity-40');
                document.getElementById('startSocLabel').textContent = "充電前 SOC (%)";
                document.getElementById('endSocLabel').textContent = "充電後 SOC (%)";
                
                // 若從「純行駛」切回「充電」，且起點電量等於上次結束電量，則清空 (避免自動帶入)
                if (editingRecordId === null) {
                    const activeRecords = records.filter(r => r.id !== "SYSTEM_METADATA" && r.id !== "CONFIG_METADATA");
                    if (activeRecords.length > 0) {
                        const lastRecord = [...activeRecords].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
                        if (lastRecord && document.getElementById('inputStartSoc').value == lastRecord.endSoc) {
                            document.getElementById('inputStartSoc').value = '';
                        }
                    }
                }
            }
            updateConvertedPowerHint();
        }

        function updateConvertedPowerHint() {
            const type = document.getElementById('inputChargeType').value;
            const start = parseFloat(document.getElementById('inputStartSoc').value) || 0;
            const end = parseFloat(document.getElementById('inputEndSoc').value) || 0;
            const hint = document.getElementById('powerHintText');
            const delta = Math.abs(end - start);
            const kwh = batteryCapacity * (delta / 100);
            hint.textContent = `共${type === "未充電" ? "消耗" : "補給"} ${delta.toFixed(0)}% 電量 (約 ${kwh.toFixed(2)} 度)`;
        }

        function autoFillStartSoc() {
            // 只有「未充電」才執行自動帶入，若輸入框有值也不覆蓋
            if (document.getElementById('inputChargeType').value !== "未充電" || editingRecordId !== null || document.getElementById('inputStartSoc').value !== '') return;
            const activeRecords = records.filter(r => r.id !== "SYSTEM_METADATA" && r.id !== "CONFIG_METADATA");
            if (activeRecords.length === 0) return;
            const lastRecord = [...activeRecords].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
            if (lastRecord && lastRecord.endSoc !== undefined) {
                document.getElementById('inputStartSoc').value = lastRecord.endSoc;
                updateConvertedPowerHint();
            }
        }

        function setupNumericRestrictions() {
            const blockKey = e => { if(['e','E','+','-'].includes(e.key)) e.preventDefault(); };
            const restrictPercent = function() {
                this.value = this.value.replace(/[^0-9]/g, ''); 
                let val = parseInt(this.value);
                if (!isNaN(val)) { if (val > 100) this.value = '100'; if (val < 0) this.value = '0'; }
                updateConvertedPowerHint();
            };
            const restrictCost = function() {
                this.value = this.value.replace(/[^0-9]/g, ''); 
                let val = parseInt(this.value);
                if (!isNaN(val) && val < 0) this.value = '0';
            };

            const dist = document.getElementById('inputDistance');
            if (dist) {
                dist.addEventListener('keypress', blockKey);
                dist.addEventListener('keypress', function(e) { if (e.key === '.' && this.value.includes('.')) e.preventDefault(); });
                dist.addEventListener('input', updateConvertedPowerHint);
            }
            
            ['inputStartSoc', 'inputEndSoc'].forEach(id => {
                const el = document.getElementById(id);
                if(el) { el.addEventListener('keypress', blockKey); el.addEventListener('input', restrictPercent); }
            });

            const cost = document.getElementById('inputCost');
            if(cost) { cost.addEventListener('keypress', blockKey); cost.addEventListener('input', restrictCost); }
        }

        // ==========================================
        // 渲染資料 (Render Dashboard & Records)
        // ==========================================
        function renderDashboard() {
            const activeRecords = records.filter(r => r.id !== "SYSTEM_METADATA" && r.id !== "CONFIG_METADATA" && r.date);
            activeRecords.sort((a, b) => new Date(a.date) - new Date(b.date) || parseInt(a.id, 10) - parseInt(b.id, 10));
            
            let filteredRecords = activeRecords;
            if (currentMonthFilter !== 'all') {
                filteredRecords = activeRecords.filter(rec => (rec.date.includes('T') ? rec.date.split('T')[0] : rec.date).startsWith(currentMonthFilter));
            }

            renderMonthFilters();

            const mobileList = document.getElementById('recordMobileList');
            const placeholder = document.getElementById('noDataPlaceholder');

            if (filteredRecords.length === 0) {
                mobileList.innerHTML = '';
                placeholder.classList.remove('hidden');
                updateStats(0, 0, 0, 0, currentMonthFilter === 'all' ? initialOdometer : 0);
                if(typeof Chart !== 'undefined') updateCharts();
                return;
            } else {
                placeholder.classList.add('hidden');
            }

            // 計算 ODO 與消耗
            let rollingOdo = initialOdometer;
            activeRecords.forEach((rec, i) => {
                let consumedSoc = 0;
                if (i === 0) consumedSoc = rec.chargeType === "未充電" ? Math.max(0, rec.startSoc - rec.endSoc) : Math.max(0, 100 - rec.startSoc);
                else {
                    const prev = activeRecords[i - 1];
                    consumedSoc = prev.endSoc !== undefined ? prev.endSoc - rec.startSoc : (rec.chargeType === "未充電" ? rec.startSoc - rec.endSoc : 100 - rec.startSoc);
                    if (consumedSoc < 0) consumedSoc = rec.chargeType === "未充電" ? Math.max(0, rec.startSoc - rec.endSoc) : Math.max(0, 100 - rec.startSoc);
                }
                rec.consumedSocPercent = consumedSoc;
                rollingOdo += parseFloat(rec.distance) || 0;
                rec.rollingOdo = rollingOdo;
            });

            let totalKm = 0, totalCost = 0, totalPowerReal = 0;
            filteredRecords.forEach(rec => {
                totalKm += parseFloat(rec.distance) || 0;
                totalCost += parseFloat(rec.cost) || 0;
                totalPowerReal += batteryCapacity * ((rec.consumedSocPercent || 0) / 100);
            });

            // 尋找最佳 MVP 勳章 (最高電耗)
            let maxEff = 0, mvpId = null;
            filteredRecords.forEach(rec => {
                const consumedPwr = batteryCapacity * ((rec.consumedSocPercent || 0) / 100);
                if (consumedPwr > 0) {
                    const eff = parseFloat((rec.distance / consumedPwr).toFixed(2));
                    if (eff > maxEff && rec.distance > 5) { maxEff = eff; mvpId = rec.id; }
                }
            });

            let html = '';
            [...filteredRecords].reverse().forEach(rec => {
                const dist = parseFloat(rec.distance) || 0;
                const pwr = batteryCapacity * ((rec.consumedSocPercent || 0) / 100);
                const eff = pwr > 0 ? (dist / pwr).toFixed(2) : "0.00";
                
                let pPercent = rec.powerPercent;
                if (pPercent === undefined || isNaN(pPercent) || pPercent === null) {
                    pPercent = (rec.startSoc !== undefined && rec.endSoc !== undefined) ? Math.abs(rec.endSoc - rec.startSoc) : 0;
                }
                
                const typeStyle = rec.chargeType.includes('快充') ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400' : (rec.chargeType.includes('慢充') ? 'bg-teal-100 text-teal-700 dark:bg-teal-900/40 dark:text-teal-400' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400');
                const displayDate = rec.date.includes('T') ? rec.date.split('T')[0] : rec.date;
                const isMVP = rec.id === mvpId && maxEff > 0;
                const mvpIcon = isMVP ? '<div class="absolute -top-1.5 -right-1.5 text-[10px] bg-amber-100 dark:bg-amber-700 border border-amber-300 dark:border-amber-500 rounded-full w-[20px] h-[20px] flex items-center justify-center shadow-md z-10" title="此列表中最神右腳">👑</div>' : '';

                // 修改這行：加強防止換行，字型微調
                const socText = (rec.startSoc !== undefined && rec.endSoc !== undefined) ? `${rec.startSoc}%➔${rec.endSoc}%` : `${pPercent}%`;

                html += `
                <div class="bg-white dark:bg-[#1e293b] p-4 rounded-[1.5rem] shadow-sm border border-slate-100 dark:border-slate-800 relative">
                    ${mvpIcon}
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-black font-mono">${displayDate}</span>
                            <span class="px-2 py-0.5 rounded-md text-[10px] font-black ${typeStyle}">${rec.chargeType.split('-')[1] || rec.chargeType}</span>
                        </div>
                        <div class="flex gap-2">
                            <button class="edit-btn text-slate-400 hover:text-amber-500 transition p-1" data-id="${rec.id}"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                            <button class="delete-btn text-slate-400 hover:text-rose-500 transition p-1" data-id="${rec.id}"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.895-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-1 sm:gap-2 text-center divide-x divide-slate-100 dark:divide-slate-800">
                        <div><div class="text-[10px] text-slate-400 font-bold mb-1">里程</div><div class="font-mono font-black text-sm">${dist}</div></div>
                        <div><div class="text-[10px] text-slate-400 font-bold mb-1">電耗</div><div class="font-mono font-black text-sm text-teal-500">${eff}</div></div>
                        <div class="col-span-1 px-0.5"><div class="text-[10px] text-slate-400 font-bold mb-1">電量</div><div class="font-mono font-black text-[11px] sm:text-xs mt-0.5 whitespace-nowrap tracking-tighter">${socText}</div></div>
                        <div><div class="text-[10px] text-slate-400 font-bold mb-1">花費</div><div class="font-mono font-black text-sm">$${rec.cost}</div></div>
                    </div>
                    ${rec.note ? `<div class="mt-3 pt-2 border-t border-slate-50 dark:border-slate-800 text-[11px] text-slate-500 font-bold">📝 ${rec.note}</div>` : ''}
                </div>`;
            });
            mobileList.innerHTML = html;

            const avgEff = totalPowerReal > 0 ? (totalKm / totalPowerReal) : 0;
            const costPerKm = totalKm > 0 ? (totalCost / totalKm) : 0;
            updateStats(totalKm, avgEff, totalCost, costPerKm, currentMonthFilter === 'all' ? initialOdometer : 0);
            if(typeof Chart !== 'undefined') updateCharts();
        }

        async function addRecord(e) {
            e.preventDefault();
            const date = document.getElementById('inputDate').value;
            const chargeType = document.getElementById('inputChargeType').value;
            const distance = parseFloat(document.getElementById('inputDistance').value);
            const startSoc = parseFloat(document.getElementById('inputStartSoc').value);
            const endSoc = parseFloat(document.getElementById('inputEndSoc').value);
            const cost = parseInt(document.getElementById('inputCost').value) || 0;
            const note = document.getElementById('inputNote').value.trim();

            if (!date || isNaN(distance) || isNaN(startSoc) || isNaN(endSoc) || ((chargeType === "未充電") ? (distance > 0) : (distance >= 0)) === false || startSoc < 0 || endSoc < 0) {
                showToast("請輸入有效的里程與能耗數值", true); return;
            }

            const powerPercent = Math.abs(chargeType === "未充電" ? startSoc - endSoc : endSoc - startSoc);
            const power = batteryCapacity * (powerPercent / 100);

            if (editingRecordId) {
                const index = records.findIndex(r => r.id === editingRecordId);
                if (index !== -1) {
                    records[index] = { ...records[index], date, chargeType, distance, power: parseFloat(power.toFixed(3)), powerPercent, startSoc, endSoc, cost, note };
                    saveLocalState(records);
                    showToast("修改成功！✨");
                }
                cancelEdit();
            } else {
                saveLocalState([...records, { id: Date.now().toString(), date, chargeType, distance, power: parseFloat(power.toFixed(3)), powerPercent, startSoc, endSoc, cost, note }]);
                showToast("新增成功！🚗");
                cancelEdit(); 
            }
            renderDashboard();
            switchTab('records'); 
            if (syncUrl) syncWithCloud('auto', true);
        }

            document.getElementById('inputDistance').value = rec.distance;

        // ==========================================
        // Google Apps Script 雲端同步
        // ==========================================
        async function syncWithCloud(mode = 'auto', isSilent = false) {
            if (!syncUrl) { if (!isSilent) showToast("請先設定雲端同步網址！", true); return; }
            
            const syncIcon = document.getElementById('navSyncIcon');
            if (syncIcon) syncIcon.classList.add('animate-spin');
            if (!isSilent) showToast("雲端同步中...");

            try {
                const getRes = await fetch(syncUrl);
                if (!getRes.ok) throw new Error("取得資料失敗");
                
                let cloudPayload = [];
                try { cloudPayload = await getRes.json(); if(!Array.isArray(cloudPayload)) cloudPayload = []; } catch (e) { cloudPayload = []; }

                let cloudLastUpdated = 0, cloudRecords = [], cloudConfig = null;
                cloudPayload.forEach(item => {
                    if (item && item.id === "SYSTEM_METADATA") cloudLastUpdated = parseInt(item.note) || 0;
                    else if (item && item.id === "CONFIG_METADATA") { try { cloudConfig = JSON.parse(item.note); } catch(err) {} }
                    else if (item) cloudRecords.push(parseRecordSoc(item));
                });

                let localLastUpdated = parseInt(localStorage.getItem('ev_life_last_updated')) || 0;
                const isCleared = localStorage.getItem('ev_life_cleared') === 'true';

                let shouldUpload = false, shouldDownload = false;
                if (mode === 'upload') shouldUpload = true;
                else if (mode === 'download') shouldDownload = true;
                else {
                    if (localLastUpdated > cloudLastUpdated && records.length === 0 && cloudRecords.length > 0 && !isCleared) localLastUpdated = 0;
                    if (localLastUpdated > cloudLastUpdated) shouldUpload = true;
                    else if (cloudLastUpdated > localLastUpdated) shouldDownload = true;
                }

                if (shouldUpload) {
                    if (mode === 'upload') { localLastUpdated = Date.now(); localStorage.setItem('ev_life_last_updated', localLastUpdated.toString()); }
                    const uploadPayload = records.map(rec => ({
                        id: rec.id, date: rec.date, chargeType: rec.chargeType, distance: rec.distance, power: rec.power, cost: rec.cost, 
                        note: (rec.startSoc !== undefined && rec.endSoc !== undefined) ? `[SOC:${rec.startSoc}-${rec.endSoc}] ${rec.note || ''}`.trim() : (rec.note || '')
                    }));
                    const configMeta = { id: "CONFIG_METADATA", date: "", chargeType: "", distance: 0, power: 0, cost: 0, note: JSON.stringify({ evName, batteryCapacity, initialOdometer }) };
                    
                    await fetch(syncUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify([...uploadPayload, { id: "SYSTEM_METADATA", note: localLastUpdated.toString() }, configMeta]) });
                    
                    localStorage.setItem('ev_life_last_sync_time', new Date().toLocaleString());
                    if (!isSilent) showToast(`同步成功！已上傳至雲端 ☁️`);
                } else if (shouldDownload) {
                    records = cloudRecords;
                    localStorage.setItem('ev_life_records', JSON.stringify(records));
                    localStorage.setItem('ev_life_last_updated', Date.now().toString()); 
                    localStorage.setItem('ev_life_last_sync_time', new Date().toLocaleString());
                    localStorage.removeItem('ev_life_cleared'); 
                    
                    if (cloudConfig) {
                        if (cloudConfig.evName) { evName = cloudConfig.evName; localStorage.setItem('ev_life_ev_name', evName); document.getElementById('topEvName').textContent = evName; document.getElementById('heroEvName').textContent = evName;}
                        if (cloudConfig.batteryCapacity) { batteryCapacity = parseFloat(cloudConfig.batteryCapacity); localStorage.setItem('ev_life_battery_capacity', batteryCapacity); }
                        if (cloudConfig.initialOdometer !== undefined) { initialOdometer = parseFloat(cloudConfig.initialOdometer); localStorage.setItem('ev_life_initial_odometer', initialOdometer); }
                    }
                    renderDashboard();
                    if (!isSilent) showToast(`同步成功！已下載覆蓋本機 📥`);
                } else {
                    localStorage.setItem('ev_life_last_sync_time', new Date().toLocaleString());
                    if (!isSilent) showToast("同步完成！資料一致 ✿");
                }
                
                updateSyncUiStatus();
                if (mode === 'download' || mode === 'upload') toggleSyncModal();
            } catch (error) {
                if (!isSilent) showToast("同步失敗，請檢查網址", true);
            } finally {
                if (syncIcon) syncIcon.classList.remove('animate-spin');
            }
        }
        function forceDownload() { showConfirmModal("以「試算表」為主？", "將下載雲端資料並「覆蓋」本機記錄。", function() { syncWithCloud('download'); }); }
        function forceUpload() { showConfirmModal("以「本機」為主？", "將上傳本機資料並「覆蓋」雲端記錄。", function() { syncWithCloud('upload'); }); }
        function parseRecordSoc(rec) {
            let startSoc = rec.startSoc, endSoc = rec.endSoc, cleanNote = rec.note || '';
            if (typeof rec.note === 'string' && rec.note.startsWith('[SOC:')) { const match = rec.note.match(/^\[SOC:(\d+)-(\d+)\]\s*(.*)/); if (match) { startSoc = parseInt(match[1], 10); endSoc = parseInt(match[2], 10); cleanNote = match[3]; } }
            let dateStr = rec.date || '';
            if (typeof dateStr === 'string') {
                if (dateStr.includes('T')) { const d = new Date(dateStr); if (!isNaN(d.getTime())) { dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; } else { dateStr = dateStr.split('T')[0]; } }
                else if (!dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) { const d = new Date(dateStr); if (!isNaN(d.getTime())) { dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; } }
            }
            return { id: rec.id?.toString() || Date.now().toString(), date: dateStr, chargeType: rec.chargeType?.toString() || 'DC-快充', distance: parseFloat(rec.distance) || 0, power: parseFloat(rec.power) || 0, powerPercent: rec.powerPercent !== undefined ? parseInt(rec.powerPercent, 10) : (startSoc !== undefined && endSoc !== undefined ? Math.abs(endSoc - startSoc) : 0), startSoc: startSoc !== undefined && !isNaN(startSoc) ? parseInt(startSoc, 10) : undefined, endSoc: endSoc !== undefined && !isNaN(endSoc) ? parseInt(endSoc, 10) : undefined, cost: rec.cost ? parseInt(rec.cost, 10) : 0, note: cleanNote };
        }

        // ==========================================
        // 分析圖表 (Chart.js)
        // ==========================================
        function setChartFilter(filter) {
            currentChartFilter = filter;
            ['btnChartAll', 'btnChartEfficiency', 'btnChartCost'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.className = "px-3 py-1.5 text-[10px] rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-white font-bold transition-all bg-transparent";
            });
            const activeBtn = document.getElementById(`btnChart${filter.charAt(0).toUpperCase() + filter.slice(1)}`);
            if (activeBtn) activeBtn.className = "px-3 py-1.5 text-[10px] rounded-lg bg-white dark:bg-slate-600 shadow text-slate-900 dark:text-white font-bold transition-all";
            updateCharts();
        }

        function updateCharts() {
            const canvasElement = document.getElementById('efficiencyChart');
            if (!canvasElement || typeof Chart === 'undefined') return;

            const isDarkMode = document.documentElement.classList.contains('dark');
            const labelColor = isDarkMode ? '#9ca3af' : '#64748b'; 
            const gridColor = isDarkMode ? 'rgba(255, 255, 255, 0.03)' : 'rgba(0, 0, 0, 0.03)';
            const tooltipBg = isDarkMode ? 'rgba(15, 23, 42, 0.9)' : 'rgba(255, 255, 255, 0.95)';
            const tooltipBorder = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)';

            let chartData = records.filter(r => r.id !== "SYSTEM_METADATA" && r.id !== "CONFIG_METADATA");
            if (currentMonthFilter !== 'all') chartData = chartData.filter(rec => (rec.date.includes('T') ? rec.date.split('T')[0] : rec.date).startsWith(currentMonthFilter));

            let labels = [], efficiencies = [], costs = [];
            const monthlyMap = {};
            chartData.forEach(rec => {
                const dateStr = rec.date.includes('T') ? rec.date.split('T')[0] : rec.date;
                if (!dateStr || dateStr.length < 7) return;
                const month = dateStr.substring(0, 7);
                if (!monthlyMap[month]) monthlyMap[month] = { distance: 0, cost: 0, consumedPower: 0 };
                monthlyMap[month].distance += (parseFloat(rec.distance) || 0);
                monthlyMap[month].cost += (parseFloat(rec.cost) || 0);
                monthlyMap[month].consumedPower += batteryCapacity * ((rec.consumedSocPercent || 0) / 100);
            });
            const sortedMonths = Object.keys(monthlyMap).sort();
            labels = sortedMonths.map(m => m.replace('-', '/'));
            efficiencies = sortedMonths.map(m => monthlyMap[m].consumedPower > 0 ? parseFloat((monthlyMap[m].distance / monthlyMap[m].consumedPower).toFixed(2)) : 0);
            costs = sortedMonths.map(m => monthlyMap[m].cost);

            const datasets = [];
            const scalesConfig = { x: { grid: { display: false, drawBorder: false }, ticks: { color: labelColor, font: { family: "'SF Mono', SFMono-Regular, 'Roboto Mono', ui-monospace, sans-serif", size: 10, weight: '600' } } } };
            const ctx = canvasElement.getContext('2d');

            if (currentChartFilter === 'all' || currentChartFilter === 'efficiency') {
                let gradient = ctx.createLinearGradient(0, 0, 0, 250);
                gradient.addColorStop(0, isDarkMode ? 'rgba(45, 212, 191, 0.4)' : 'rgba(20, 184, 166, 0.2)'); 
                gradient.addColorStop(1, 'rgba(45, 212, 191, 0.0)'); 
                datasets.push({
                    label: '平均電耗 (km/度)', data: efficiencies, borderColor: isDarkMode ? '#2dd4bf' : '#0d9488', borderWidth: 3, 
                    pointBackgroundColor: isDarkMode ? '#1e293b' : '#ffffff', pointBorderColor: isDarkMode ? '#2dd4bf' : '#0d9488', pointBorderWidth: 2, pointRadius: 3, 
                    tension: 0.4, yAxisID: 'yEfficiency', fill: true, backgroundColor: gradient
                });
                scalesConfig.yEfficiency = { type: 'linear', position: 'left', ticks: { color: isDarkMode ? '#2dd4bf' : '#0d9488', font: { family: "'SF Mono', SFMono-Regular, sans-serif", weight: '600' }, maxTicksLimit: 6 }, border: { display: false }, grid: { color: gridColor } };
            }

            if (currentChartFilter === 'all' || currentChartFilter === 'cost') {
                let barGrad = ctx.createLinearGradient(0, 0, 0, 200);
                barGrad.addColorStop(0, isDarkMode ? 'rgba(251, 191, 36, 0.8)' : 'rgba(245, 158, 11, 0.7)');
                barGrad.addColorStop(1, isDarkMode ? 'rgba(251, 191, 36, 0.2)' : 'rgba(245, 158, 11, 0.2)');
                datasets.push({ label: '補給費用 (元)', type: 'bar', data: costs, backgroundColor: barGrad, borderRadius: 4, yAxisID: 'yCost', barThickness: 12 });
                scalesConfig.yCost = { type: 'linear', position: 'right', ticks: { color: isDarkMode ? '#fbbf24' : '#f59e0b', font: { family: "'SF Mono', SFMono-Regular, sans-serif", weight: '600' }, maxTicksLimit: 6 }, border: { display: false }, grid: { display: false } };
            }

            if (efficiencyChartInstance) {
                efficiencyChartInstance.data.labels = labels; efficiencyChartInstance.data.datasets = datasets; efficiencyChartInstance.options.scales = scalesConfig;
                efficiencyChartInstance.options.plugins.legend.labels.color = labelColor; efficiencyChartInstance.options.plugins.tooltip.backgroundColor = tooltipBg; efficiencyChartInstance.options.plugins.tooltip.titleColor = isDarkMode ? '#f8fafc' : '#1e293b'; efficiencyChartInstance.options.plugins.tooltip.bodyColor = isDarkMode ? '#cbd5e1' : '#475569'; efficiencyChartInstance.options.plugins.tooltip.borderColor = tooltipBorder;
                efficiencyChartInstance.update();
            } else {
                efficiencyChartInstance = new Chart(ctx, {
                    type: 'line', data: { labels: labels, datasets: datasets },
                    options: {
                        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, 
                        plugins: { legend: { position: 'top', align: 'end', labels: { color: labelColor, boxWidth: 8, boxHeight: 8, usePointStyle: true, font: { family: "'Noto Sans TC', sans-serif", size: 11, weight: '600' } } },
                        tooltip: { backgroundColor: tooltipBg, titleColor: isDarkMode ? '#f8fafc' : '#1e293b', bodyColor: isDarkMode ? '#cbd5e1' : '#475569', borderColor: tooltipBorder, borderWidth: 1, borderRadius: 12, padding: 12, backdropFilter: 'blur(8px)', titleFont: { family: "'Noto Sans TC', sans-serif", weight: 'bold', size: 13 }, bodyFont: { family: "'Noto Sans TC', sans-serif", weight: '500', size: 12 } } },
                        scales: scalesConfig
                    }
                });
            }
        }

        // ==========================================
        // PWA 與系統工具
        // ==========================================
        function exportCSV() {
            const activeRecords = records.filter(r => r.id !== "SYSTEM_METADATA" && r.id !== "CONFIG_METADATA");
            if (activeRecords.length === 0) { showToast("無資料可匯出！", true); return; }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF日期,補給類型,行駛里程(km),電量消耗(kWh),起始電量(%),結束電量(%),補給費用(元),備註\n";
            activeRecords.forEach(rec => { csvContent += `${rec.date.includes('T') ? rec.date.split('T')[0] : rec.date},${rec.chargeType},${rec.distance},${rec.power},${rec.startSoc !== undefined ? rec.startSoc : ''},${rec.endSoc !== undefined ? rec.endSoc : ''},${rec.cost},"${(rec.note || '').replace(/"/g, '""')}"\n`; });
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `EV_Life_Record_${new Date().toISOString().slice(0,10)}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link);
            showToast("CSV 匯出成功！");
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' }).then(reg => updatePwaDiagnostic()).catch(err => updatePwaDiagnostic());
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            const pwaBtn = document.getElementById('pwaInstallBtn');
            if (pwaBtn) { pwaBtn.classList.remove('hidden'); pwaBtn.classList.add('flex'); }
            updatePwaDiagnostic();
        });

        function triggerPwaInstall() {
            if (!deferredPrompt) { showToast("目前裝置不支援或已安裝APP🐾"); return; }
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((res) => {
                if (res.outcome === 'accepted') { showToast("感謝安裝！🎉"); document.getElementById('pwaInstallBtn').classList.add('hidden'); } 
                else showToast("已取消安裝", true);
                deferredPrompt = null;
            });
        }

        window.addEventListener('appinstalled', () => { showToast("安裝成功！🎉"); document.getElementById('pwaInstallBtn').classList.add('hidden'); updatePwaDiagnostic(); });

        function updatePwaDiagnostic() {
            const isHttps = window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const diagHttps = document.getElementById('diag-https'), diagSw = document.getElementById('diag-sw'), diagNetwork = document.getElementById('diag-network');
            if (diagHttps) diagHttps.innerHTML = window.location.protocol === 'file:' ? '🔴 本機檔案，不允許 SW' : (isHttps ? '🟢 安全連線' : '🔴 非安全連線');
            if (diagSw) {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistration().then(reg => { diagSw.innerHTML = (reg && reg.active) ? '🟢 離線引擎運行中' : '🟡 引擎未安裝'; }).catch(() => diagSw.innerHTML = '⚪ 引擎未就緒');
                } else diagSw.innerHTML = '🔴 瀏覽器不支援';
            }
            if (diagNetwork) diagNetwork.innerHTML = navigator.onLine ? '🟢 網路連線正常' : '🔴 離線模式';
        }

        window.addEventListener('online', () => { updatePwaDiagnostic(); showToast("網路恢復連線 ⚡"); });
        window.addEventListener('offline', () => { updatePwaDiagnostic(); showToast("進入離線模式 🐾", true); });

        function downloadBlobFile(content, fileName, contentType) {
            const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content], {type: contentType})); a.download = fileName; a.click(); URL.revokeObjectURL(a.href);
        }

        function downloadManifest() {
            const obj = { "name": "Ev Life - LUXGEN n⁷ APP", "short_name": "Ev Life", "start_url": "./index.html", "display": "standalone", "background_color": "#0f172a", "theme_color": "#0f172a", "icons": [ { "src": "./icon-192.png", "sizes": "192x192", "type": "image/png" }, { "src": "./splash.png", "sizes": "512x512", "type": "image/png" } ] };
            downloadBlobFile(JSON.stringify(obj, null, 2), "manifest.json", "application/json");
        }

        function downloadServiceWorker() {
            const swCode = `const CACHE='ev-cache-v9', ASSETS=['./','./index.html','./manifest.json','./logo.png','./splash.png']; self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()))); self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.map(x=>x!==CACHE?caches.delete(x):0))).then(()=>self.clients.claim()))); self.addEventListener('fetch',e=>{if(e.request.url.includes('script.google.com'))return; e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(nr=>{if(nr.status===200)caches.open(CACHE).then(c=>c.put(e.request,nr.clone()));return nr;})))});\n`;
            downloadBlobFile(swCode, "sw.js", "application/javascript");
        }
    </script>
</body>
